name: Update board embed

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC (07:17 in The Hague in summer, 06:17 in winter)
  workflow_dispatch:        # "Run workflow" button for manual updates

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch board and build embed
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
        run: python build.py

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name "THHH board bot"
          git config user.email "actions@users.noreply.github.com"
          git add dorl-embed.html data/metadata.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Weekly board update $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/dorl-embed.html"
