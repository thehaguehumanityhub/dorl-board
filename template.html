<div id="thhh-dorl" class="dorl">
<style>
#thhh-dorl{--p:var(--strl-color-primary,#17345e);--s:var(--strl-color-secondary,#b2dab8);--t:var(--strl-color-tertiary,#a79fc8);--q:var(--strl-color-quarternary,#e4dc4b);--gl:var(--strl-color-grey-light,#f3f5f7);--g:var(--strl-color-grey,#bcbcbc);
  font-family:var(--strl-base-font,"Chivo"),system-ui,sans-serif;color:var(--p);line-height:1.5;max-width:1180px;margin:0 auto;box-sizing:border-box}
#thhh-dorl *{box-sizing:border-box}
#thhh-dorl .dorl-head{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between;margin-bottom:24px}
#thhh-dorl h2{font-family:var(--strl-headings-font,"Chivo"),system-ui,sans-serif;font-weight:900;font-size:clamp(26px,3.4vw,38px);line-height:1.1;margin:0}
#thhh-dorl .dorl-sub{margin:6px 0 0;font-size:15px;opacity:.8;max-width:56ch}
#thhh-dorl .dorl-search{position:relative;flex:0 1 320px;min-width:220px}
#thhh-dorl .dorl-search input{width:100%;font:inherit;font-size:15px;color:var(--p);padding:12px 16px 12px 42px;border:2px solid var(--p);border-radius:40px;background:#fff;outline:none}
#thhh-dorl .dorl-search input:focus{box-shadow:0 0 0 4px var(--s)}
#thhh-dorl .dorl-search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px}
#thhh-dorl .dorl-body{display:grid;grid-template-columns:270px 1fr;gap:32px;align-items:start}
#thhh-dorl .dorl-tabs{display:flex;flex-direction:column;gap:4px;position:sticky;top:16px;margin:0;padding:0}
#thhh-dorl .dorl-tab{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;border-radius:40px;font-size:15px;font-weight:700;line-height:1.3;color:var(--p);transition:background .15s}
#thhh-dorl .dorl-tab:hover{background:var(--gl)}
#thhh-dorl .dorl-tab:focus-visible{outline:3px solid var(--t);outline-offset:2px}
#thhh-dorl .dorl-tab[aria-selected="true"]{background:var(--p);color:#fff}
#thhh-dorl .dorl-tab .n{font-size:12px;font-weight:700;min-width:26px;text-align:center;padding:2px 8px;border-radius:20px;background:var(--gl);color:var(--p)}
#thhh-dorl .dorl-tab[aria-selected="true"] .n{background:var(--s)}
#thhh-dorl .dorl-tab .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-right:-4px}
#thhh-dorl .dorl-tab .lbl{flex:1}
#thhh-dorl .dorl-panelhead{display:flex;align-items:baseline;gap:12px;margin:0 0 16px;flex-wrap:wrap}
#thhh-dorl .dorl-panelhead h3{font-weight:900;font-size:22px;margin:0}
#thhh-dorl .dorl-panelhead span{font-size:14px;opacity:.7}
#thhh-dorl .dorl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
#thhh-dorl .dorl-card{position:relative;display:flex;flex-direction:column;gap:10px;padding:20px;background:#fff;border:2px solid var(--gl);border-radius:24px;text-decoration:none;color:var(--p);transition:transform .15s,box-shadow .15s,border-color .15s;min-height:150px}
#thhh-dorl .dorl-card:hover{transform:translate(-4px,4px);box-shadow:8px -8px 0 var(--t);border-color:var(--p)}
#thhh-dorl .dorl-card:focus-visible{outline:3px solid var(--t);outline-offset:3px}
#thhh-dorl .dorl-src{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;opacity:.85;min-width:0}
#thhh-dorl .dorl-src .mono{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;background:var(--s);color:var(--p);overflow:hidden}
#thhh-dorl .dorl-src .mono img{width:16px;height:16px}
#thhh-dorl .dorl-src .h{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#thhh-dorl .dorl-title{font-size:17px;font-weight:900;line-height:1.3;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#thhh-dorl .dorl-desc{font-size:14px;opacity:.8;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#thhh-dorl .dorl-meta{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
#thhh-dorl .tag{padding:3px 10px;border-radius:20px;font-weight:700;background:var(--gl)}
#thhh-dorl .tag.new{background:var(--q)}
#thhh-dorl .tag.done{background:var(--p);color:#fff}
#thhh-dorl .dorl-meta .date{margin-left:auto;opacity:.65}
#thhh-dorl .dorl-empty{padding:40px;text-align:center;background:var(--gl);border-radius:24px}
#thhh-dorl .dorl-foot{margin-top:28px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:14px;opacity:.85}
#thhh-dorl .dorl-foot a{color:var(--p);font-weight:700}
#thhh-dorl .dorl-hit{font-size:12px;font-weight:700;opacity:.7;margin:-4px 0 0}
@media (max-width:820px){
  #thhh-dorl .dorl-body{grid-template-columns:1fr;gap:16px}
  #thhh-dorl .dorl-tabs{flex-direction:row;overflow-x:auto;position:static;padding-bottom:6px;scrollbar-width:thin;scroll-snap-type:x proximity}
  #thhh-dorl .dorl-tab{white-space:nowrap;border:2px solid var(--p);scroll-snap-align:start}
  #thhh-dorl .dorl-search{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){#thhh-dorl *{transition:none!important}}
</style>
<div class="dorl-head">
  <div><h2 data-board></h2><p class="dorl-sub">Initiatives, events, news and publications curated for the Democracy and Rule of Law Collective by The Hague Humanity Hub.</p></div>
  <label class="dorl-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" placeholder="Search all categories" aria-label="Search all categories"></label>
</div>
<div class="dorl-body">
  <div class="dorl-tabs" role="tablist" aria-label="Board categories"></div>
  <div class="dorl-panel" role="tabpanel" tabindex="0"></div>
</div>
<div class="dorl-foot"><span data-updated></span><a data-trello target="_blank" rel="noopener">View the full board on Trello</a></div>
<script>
(function(){
  var D=/*DATA*/null, root=document.getElementById('thhh-dorl');
  var tabs=root.querySelector('.dorl-tabs'), panel=root.querySelector('.dorl-panel'), q=root.querySelector('input');
  var C={magenta:'#c84b8a',yellow:'#e4dc4b'}, cur=0;
  var fetched=new Date(D.updated), NEWDAYS=D.newDays||7;
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function fmt(d){return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
  function isNew(it){return (fetched-new Date(it.added))/864e5<=NEWDAYS}
  root.querySelector('[data-board]').textContent=D.board;
  root.querySelector('[data-updated]').textContent='Last updated '+fmt(D.updated);
  root.querySelector('[data-trello]').href=D.url;
  D.lists.forEach(function(l,i){
    var b=document.createElement('button');b.className='dorl-tab';b.setAttribute('role','tab');b.id='dorl-t'+i;
    b.innerHTML=(l.color?'<span class="dot" style="background:'+(C[l.color]||l.color)+'"></span>':'')+'<span class="lbl">'+esc(l.name)+'</span><span class="n">'+l.items.length+'</span>';
    b.onclick=function(){q.value='';show(i)};tabs.appendChild(b)});
  tabs.addEventListener('keydown',function(e){var n=D.lists.length;
    if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();show((cur+1)%n,true)}
    if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();show((cur-1+n)%n,true)}});
  function card(it,listName){
    var ini=esc((it.host||'?').charAt(0).toUpperCase());
    var tags=(isNew(it)?'<span class="tag new">New</span>':'')+(it.done?'<span class="tag done">Past</span>':'')+(it.kind?'<span class="tag">'+it.kind+'</span>':'')+(it.lang?'<span class="tag">'+it.lang+'</span>':'');
    return '<a class="dorl-card" href="'+esc(it.url)+'" target="_blank" rel="noopener">'+
      (listName?'<p class="dorl-hit">'+esc(listName)+'</p>':'')+
      '<div class="dorl-src"><span class="mono">'+(it.favicon?'<img alt="" loading="lazy" src="https://www.google.com/s2/favicons?sz=32&domain='+encodeURIComponent(it.favicon)+'" onerror="this.replaceWith(document.createTextNode(\''+ini+'\'))">':ini)+'</span><span class="h">'+esc(it.host)+'</span></div>'+
      '<p class="dorl-title">'+esc(it.title)+'</p>'+(it.desc?'<p class="dorl-desc">'+esc(it.desc)+'</p>':'')+
      '<div class="dorl-meta">'+tags+'<span class="date">Added '+fmt(it.added)+'</span></div></a>'}
  function show(i,focus){cur=i;
    [].forEach.call(tabs.children,function(b,j){b.setAttribute('aria-selected',j===i);b.tabIndex=j===i?0:-1});
    if(focus)tabs.children[i].focus();
    panel.setAttribute('aria-labelledby','dorl-t'+i);
    var l=D.lists[i];
    panel.innerHTML='<div class="dorl-panelhead"><h3>'+esc(l.name)+'</h3><span>'+l.items.length+' item'+(l.items.length===1?'':'s')+'</span></div>'+
      (l.items.length?'<div class="dorl-grid">'+l.items.map(function(it){return card(it)}).join('')+'</div>':'<div class="dorl-empty">Nothing here yet.</div>')}
  q.addEventListener('input',function(){var s=q.value.trim().toLowerCase();
    if(!s){show(cur);return}
    [].forEach.call(tabs.children,function(b){b.setAttribute('aria-selected','false')});
    var hits=[];D.lists.forEach(function(l){l.items.forEach(function(it){if((it.title+' '+it.host+' '+it.desc+' '+l.name).toLowerCase().indexOf(s)>-1)hits.push([it,l.name])})});
    panel.innerHTML='<div class="dorl-panelhead"><h3>Search results</h3><span>'+hits.length+' across all categories</span></div>'+
      (hits.length?'<div class="dorl-grid">'+hits.map(function(h){return card(h[0],h[1])}).join('')+'</div>':'<div class="dorl-empty">No items match “'+esc(q.value)+'”.</div>')});
  show(0);
})();
</script>
</div>
